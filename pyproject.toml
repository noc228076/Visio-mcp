[project]
name = "visio-mcp-server"
version = "0.1.0"
description = "A local MCP server for creating and editing Microsoft Visio flowcharts through COM automation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12.4",
    "pydantic>=2.7",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
visio-mcp-server = "visio_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visio_mcp_server"]
